[project]
name = "sora"
version = "0.1.0"
description = "A local personal AI assistant: harness, loop, memory, tools and ops."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6",
    "fastembed>=0.9.1",
    "mcp>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
providers = [
    "openai>=3.51.0",
]
memory-pg = [
    "psycopg[binary]>=3.2",
]
memory-langmem = [
    "langchain-anthropic>=1.7.10",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langmem>=0.0.30",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
